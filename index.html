<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d71920">
<title>Los Santos Customs · Calculadora</title>
<style>
:root{
  --bg:#0d0b18; --panel:#151329; --panel2:#1b1835; --line:#38334f;
  --text:#f3f3f6; --muted:#aaa7bc; --red:#7169c9; --red2:#948be8;
  --gold:#e1e1e8; --green:#8d86d9;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 50% -10%,rgba(215,25,32,.24),transparent 38%),
    linear-gradient(180deg,#0b0c10 0%,#08090c 100%);
}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1180px,calc(100% - 28px));margin:auto;padding:24px 0 150px}

/* HEADER */
.header{
  position:relative; overflow:hidden; border:1px solid var(--line); border-radius:24px;
  padding:28px; margin-bottom:18px; background:linear-gradient(135deg,#211d3d,#12101f);
  box-shadow:0 20px 60px rgba(0,0,0,.28)
}
.header:after{
  content:""; position:absolute; width:300px;height:300px;right:-130px;top:-160px;
  border-radius:50%; background:rgba(112,103,201,.16); filter:blur(10px)
}
.brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.logo-wrap{
  width:250px; flex:none; border-radius:18px; overflow:hidden;
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 12px 35px rgba(45,38,90,.35);
  background:#171530;
}
.logo-img{display:block;width:100%;height:auto}
.eyebrow{margin:0 0 4px;color:#a9a3ee;font-weight:800;letter-spacing:.13em;font-size:11px;text-transform:uppercase}
h1{margin:0;font-size:clamp(28px,5vw,44px);line-height:1}
.subtitle{margin:9px 0 0;color:var(--muted)}
.badge{margin-left:auto;align-self:flex-start;border:1px solid #3a404b;background:#0c0e12;color:#cdd1d8;padding:8px 11px;border-radius:999px;font-size:12px;font-weight:750}

/* CONTROLS */
.toolbar{
  display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;
  margin-bottom:18px
}
.mode{
  display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--panel);
  border:1px solid var(--line);border-radius:14px
}
.mode button,.toolbar-btn{
  border:1px solid transparent;background:transparent;color:var(--muted);
  padding:11px 14px;border-radius:10px;font-weight:800
}
.mode button.active{background:linear-gradient(135deg,#7169c9,#5650a0);color:#fff;box-shadow:0 7px 20px rgba(83,76,160,.28)}
.toolbar-btn{border-color:var(--line);background:var(--panel);color:var(--text)}
.toolbar-btn:hover{border-color:#59616f}
.search{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  border-radius:14px;padding:12px 14px;outline:none
}
.search:focus{border-color:var(--red)}

/* CATEGORIES */
.category{margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.category h2{font-size:14px;margin:0;text-transform:uppercase;letter-spacing:.1em}
.category span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.item{
  background:linear-gradient(145deg,var(--panel2),#111318);border:1px solid var(--line);
  border-radius:15px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:12px;
  align-items:center;transition:.18s
}
.item:hover{border-color:#484f5b;transform:translateY(-1px)}
.item.selected{border-color:rgba(119,112,207,.7);box-shadow:inset 3px 0 0 #7169c9}
.name{font-weight:800;font-size:14px}
.price{margin-top:4px;color:var(--gold);font-size:12px;font-weight:700}
.qty{display:flex;align-items:center;gap:6px}
.qty button{
  width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  background:#0c0e12;color:#fff;font-weight:900;font-size:18px
}
.qty button:hover{border-color:#7770cf;color:#aaa4ee}
.qty input{
  width:54px;height:34px;background:#0b0d10;color:#fff;border:1px solid var(--line);
  border-radius:9px;text-align:center;outline:none;font-weight:800
}
.qty input:focus{border-color:var(--red)}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:.5}

/* SUMMARY */
.summary{
  position:fixed;z-index:20;left:50%;bottom:14px;transform:translateX(-50%);
  width:min(920px,calc(100% - 28px));background:rgba(17,19,24,.96);
  backdrop-filter:blur(18px);border:1px solid #4a505b;border-radius:20px;
  padding:14px 16px;box-shadow:0 18px 70px rgba(0,0,0,.55)
}
.summary-main{display:flex;align-items:center;gap:18px}
.stat{min-width:130px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{font-size:20px}
.total{margin-left:auto;text-align:right}.total small{color:var(--muted);font-size:11px}.total strong{display:block;color:var(--gold);font-size:28px;line-height:1.05}
.details-btn{
  border:1px solid var(--line);background:#0c0e12;color:#fff;border-radius:10px;padding:10px 12px;font-weight:800
}
.breakdown{display:none;border-top:1px solid var(--line);margin-top:12px;padding-top:10px;max-height:170px;overflow:auto}
.breakdown.open{display:block}
.break-row{display:flex;justify-content:space-between;gap:15px;padding:6px 0;color:#c3c7cf;font-size:12px}
.empty{color:var(--muted);padding:10px 0;font-size:12px}

/* FOOTER */
.footer{text-align:center;color:#5e6674;font-size:11px;margin-top:20px}
.hidden{display:none!important}

@media(max-width:850px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar{grid-template-columns:1fr 1fr}
  .search{grid-column:1/-1;grid-row:1}
  .mode{grid-column:1/-1}
}
@media(max-width:600px){
  .container{width:min(100% - 16px,1180px);padding-top:12px}
  .header{padding:20px;border-radius:18px}
  .logo-wrap{width:190px}
  .badge{display:none}
  .brand{align-items:flex-start}
  .brand-copy{padding-top:2px}
  .grid{grid-template-columns:1fr}
  .toolbar{grid-template-columns:1fr 1fr}
  .summary{bottom:8px;width:calc(100% - 16px)}
  .summary-main{gap:10px}
  .stat{min-width:65px}.stat strong{font-size:17px}
  .total strong{font-size:23px}
  .details-btn{padding:9px}
}
</style>
</head>

    </div>
    <div class="brand-copy">
      <p class="eyebrow">Spain RP · Taller</p>
      <h1>Calculadora de Pedidos</h1>
      <p class="subtitle">Presupuestos rápidos y sin errores</p>
    </div>
    <div class="badge">LOS SANTOS CUSTOMS</div>
  </div>
</header>

<section class="toolbar">
  <div class="mode">
    <button id="clientBtn" class="active" onclick="setMode('client')">Cliente</button>
    <button id="staffBtn" onclick="setMode('staff')">Mecánico / Convenio</button>
  </div>
  <button class="toolbar-btn" onclick="resetAll()">↺ Reiniciar</button>
  <button class="toolbar-btn" onclick="copyOrder()">⧉ Copiar pedido</button>
  <input id="search" class="search" type="search" placeholder="Buscar mejora, pintura, ruedas..." oninput="render()">
</section>

<main id="items"></main>

<p class="footer">Los precios se calculan automáticamente según la tarifa seleccionada · Los Santos Customs · Spain RP</p>
</div>

<section class="summary">
  <div class="summary-main">
    <div class="stat"><small>UNIDADES</small><strong id="units">0</strong></div>
    <div class="stat"><small>CONCEPTO</small><strong id="selected">0</strong></div>
    <button class="details-btn" onclick="toggleBreakdown()">Desglose</button>
    <div class="total"><small>TOTAL DEL PEDIDO</small><strong id="total">0€</strong></div>
  </div>
  <div id="breakdown" class="breakdown"></div>
</section>

<script>
const products = [
  ["Full Tuning + Rendimientos",140000,126000,"Paquetes"],
  ["Motor V8",50000,45000,"Rendimiento"],
  ["Frenos Cerámicos",15000,13500,"Rendimiento"],
  ["Turbo",30000,27000,"Rendimiento"],
  ["Tracción AWD",10000,9000,"Tracción"],
  ["Tracción RWD",9000,8100,"Tracción"],
  ["Tracción FWD",8000,7200,"Tracción"],
  ["Neumáticos Slicks",7000,6300,"Neumáticos"],
  ["Neumáticos Semi-slicks",6500,5850,"Neumáticos"],
  ["Neumáticos Offroad",6000,5400,"Neumáticos"],
  ["Cosméticos",3500,3150,"Estética"],
  ["Rendimiento",9500,8550,"Rendimiento"],
  ["Set de Rines",8500,7650,"Estética"],
  ["Kit de suspensión",3000,2700,"Rendimiento"],
  ["Reparación",900,900,"Servicio"],
  ["Pintura",1500,1350,"Estética"],
  ["Kit de humo",8000,7200,"Estética"],
  ["Kit de extras",5000,4500,"Estética"],
  ["Kit de Limpieza",350,315,"Servicio"],
  ["Full Tuning",110000,99000,"Paquetes"]
];

let mode="client";
let quantities=products.map(()=>0);
const money=n=>new Intl.NumberFormat("es-ES").format(n)+"€";

function setMode(newMode){
  mode=newMode;
  document.getElementById("clientBtn").classList.toggle("active",mode==="client");
  document.getElementById("staffBtn").classList.toggle("active",mode==="staff");
  render();
}
function changeQty(i,delta){
  quantities[i]=Math.max(0,quantities[i]+delta);
  render();
}
function setQty(i,value){
  const n=parseInt(value);
  quantities[i]=Number.isFinite(n)?Math.max(0,n):0;
  calculate();
  const card=document.querySelector(`[data-index="${i}"]`);
  if(card) card.classList.toggle("selected",quantities[i]>0);
}
function render(){
  const root=document.getElementById("items");
  const q=document.getElementById("search").value.trim().toLowerCase();
  const groups={};
  products.forEach((p,i)=>{
    if(q && !p[0].toLowerCase().includes(q) && !p[3].toLowerCase().includes(q)) return;
    (groups[p[3]]??=[]).push([p,i]);
  });
  const order=["Paquetes","Rendimiento","Tracción","Neumáticos","Estética","Servicio"];
  root.innerHTML=order.filter(g=>groups[g]?.length).map(g=>`
    <section class="category-section">
      <div class="category"><h2>${g}</h2><span>${groups[g].length} opciones</span></div>
      <div class="grid">${groups[g].map(([p,i])=>{
        const price=p[mode==="client"?1:2];
        return `<article class="item ${quantities[i]>0?"selected":""}" data-index="${i}">
          <div><div class="name">${p[0]}</div><div class="price">${money(price)} / unidad</div></div>
          <div class="qty">
            <button aria-label="Restar" onclick="changeQty(${i},-1)">−</button>
            <input type="number" min="0" step="1" value="${quantities[i]}" aria-label="Cantidad de ${p[0]}" onchange="setQty(${i},this.value)">
            <button aria-label="Sumar" onclick="changeQty(${i},1)">+</button>
          </div>
        </article>`;
      }).join("")}</div>
    </section>`).join("") || `<div class="empty">No se ha encontrado ningún producto.</div>`;
  calculate();
}
function calculate(){
  let total=0,units=0,concepts=0,lines=[];
  products.forEach((p,i)=>{
    const qty=quantities[i],price=p[mode==="client"?1:2];
    if(qty>0){units+=qty;concepts++;total+=qty*price;lines.push(`<div class="break-row"><span>${qty}× ${p[0]}</span><strong>${money(qty*price)}</strong></div>`);}
  });
  document.getElementById("units").textContent=units;
  document.getElementById("selected").textContent=concepts;
  document.getElementById("total").textContent=money(total);
  document.getElementById("breakdown").innerHTML=lines.length?lines.join(""):`<div class="empty">Añade cantidades para ver el desglose.</div>`;
}
function resetAll(){quantities=products.map(()=>0);document.getElementById("search").value="";render();}
function toggleBreakdown(){document.getElementById("breakdown").classList.toggle("open");}
function copyOrder(){
  const selected=products.map((p,i)=>({p,i})).filter(x=>quantities[x.i]>0);
  if(!selected.length){alert("No hay ningún producto seleccionado.");return;}
  const total=selected.reduce((s,x)=>s+quantities[x.i]*x.p[mode==="client"?1:2],0);
  const label=mode==="client"?"Cliente":"Mecánico / Convenio";
  const text=[
    "LOS SANTOS CUSTOMS · SPAIN RP",
    `Tarifa: ${label}`,
    "",
    ...selected.map(x=>`${quantities[x.i]}× ${x.p[0]} — ${money(quantities[x.i]*x.p[mode==="client"?1:2])}`),
    "",
    `TOTAL: ${money(total)}`
  ].join("\\n");
  navigator.clipboard?.writeText(text).then(()=>alert("Pedido copiado al portapapeles."));
}
render();
</script>
</body>
</html>
